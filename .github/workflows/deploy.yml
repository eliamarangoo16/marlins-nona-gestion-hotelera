name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construir
        env:
          # Valores públicos (la llave publicable de Supabase y la VAPID pública están pensadas para ir en el navegador)
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: https://fjnkjlrbxunaflwdjlvp.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6hM9qKyri7X9ceDQ7jgkKg_QqRyi-qB
          VITE_VAPID_PUBLIC_KEY: BBKDhverAkFO7VV6lxtqhryUAtOnvPCpnqOQo4wIRbVSsjTXQJbxVkAeobfQiTP3h5jgSDlmgLobUR3vbyx4cX0
        run: npm run build
      - name: Fallback SPA (rutas directas y recarga)
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
